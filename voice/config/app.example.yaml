schema: 1
voice:
  backend: auto
  threads: 4
  # In ESP32-S3 mode, the board's readback switch controls TTS.
  tts_enabled: false
  tts_prewarm: false
  preview_interval_seconds: 1.0
  refine: true
  maximum_audio_seconds: 30
  vad_enabled: true
  vad_threshold: 0.35
  # HF enhancement stays off until its model is tuned for the board microphone.
  hgtcrn_enabled: false
  # Empty paths use the matching files in project/models/frontend.
  vad_model: ""
  hgtcrn_model: ""
  # Empty model paths keep project-local models discovery and HMI_MODEL_DIR.
  asr_model: ""
  tts_model: ""
audio:
  # Set esp32_host to the board's current Wi-Fi IPv4 address.
  source: esp32
  esp32_host: 172.16.30.145
  esp32_port: 5000
  # Board speaker volume, 0..100 (persisted on the board).
  volume: 70
logging:
  level: info
  file: logs/hmi.log
  max_size_mb: 5
  max_files: 3
  console: false
